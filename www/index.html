@@ Foundations of Computational Reasoning
== Module 1: Linear Algebra
# Key ideas
- A matrix is in **row echelon form (REF)** when zero rows are at the bottom and each leading entry is to the right of the one above it. **RREF** also needs every leading entry to be 1 and the only nonzero entry in its column.
- **Rank** = number of nonzero rows in an echelon form (the number of independent rows).
- **Consistency (Rouché–Capelli):** $Ax=b$ has a solution only if $\operatorname{rank}(A)=\operatorname{rank}([A|b])$. If rank $=n$ (unknowns) the solution is unique; if rank $<n$ there are infinitely many.
- **Gaussian elimination:** forward elimination to REF, then back-substitution. **Gauss–Jordan:** continue to RREF and read the answer directly.
- **Dense** matrices store all $m\times n$ entries, $O(mn)$ memory. **Sparse** matrices are mostly zeros, so storing only the $nnz$ nonzeros (COO or CSR) costs $O(nnz)$.
# Worked example
Solve $x+y=3,\ 2x-y=0$. Add the equations: $3x=3$, so $x=1$, $y=2$. Rank of the coefficient matrix is 2 = number of unknowns, so the solution is unique.
# Practice
Q: Find the rank of $\begin{bmatrix}1&2\\2&4\end{bmatrix}$. ::: Row 2 $=2\times$ row 1, so after elimination one zero row remains: rank $=1$.
Q: When is a system with 3 equations and 3 unknowns inconsistent? ::: When $\operatorname{rank}(A)<\operatorname{rank}([A|b])$, for example a row $[0\ 0\ 0\,|\,5]$.
== Module 2: Vector Space
# Key ideas
- A **vector space** is a set closed under addition and scalar multiplication that has a zero vector and additive inverses. A **subspace** must contain $0$ and be closed under both operations.
- **Basis:** linearly independent vectors that span the space; the number of them is the **dimension**.
- **Linear transformation:** $T(au+bv)=aT(u)+bT(v)$. Every one is a matrix multiplication $T(x)=Ax$.
- **Eigenvalues:** $Av=\lambda v$ with $v\ne 0$, found from $\det(A-\lambda I)=0$. Sum of eigenvalues $=\operatorname{trace}(A)$, product $=\det(A)$.
- **Diagonalization:** if $A$ has $n$ independent eigenvectors, $A=PDP^{-1}$ and $A^k=PD^kP^{-1}$.
- **SVD:** $A=U\Sigma V^{T}$ with $\sigma_i=\sqrt{\lambda_i(A^TA)}$. Keeping the $k$ largest singular values gives the best rank-$k$ approximation; variance kept is $\sum_{i\le k}\sigma_i^2/\sum_i\sigma_i^2$.
# Worked example
$A=\begin{bmatrix}4&1\\2&3\end{bmatrix}$: $\lambda^2-7\lambda+10=0$, so $\lambda=5,2$. For $\lambda=5$: $v=(1,1)$. For $\lambda=2$: $v=(1,-2)$.
# Practice
Q: Eigenvalues of a triangular matrix? ::: The diagonal entries.
Q: Why use SVD for compression? ::: Small singular values carry little variance, so dropping them reduces storage with small error.
== Module 3: Differential Calculus
# Key ideas
- **Partial derivative:** differentiate with respect to one variable, others fixed: $f_x,\ f_y$. Mixed partials are equal when continuous: $f_{xy}=f_{yx}$.
- **Chain rule:** $\dfrac{dz}{dt}=\dfrac{\partial z}{\partial x}\dfrac{dx}{dt}+\dfrac{\partial z}{\partial y}\dfrac{dy}{dt}$. This is the core of backpropagation.
- **Gradient:** $\nabla f=(f_x,f_y)$ points in the direction of steepest increase. **Directional derivative:** $D_uf=\nabla f\cdot u$ for a unit vector $u$.
- **Critical points:** $\nabla f=0$. **Second-derivative test:** $D=f_{xx}f_{yy}-f_{xy}^2$. If $D>0$ and $f_{xx}>0$: minimum. $D>0$ and $f_{xx}<0$: maximum. $D<0$: saddle.
- **Gradient descent:** $x_{k+1}=x_k-\eta\nabla f(x_k)$.
# Worked example
$f=x^2+y^2-2x$: $\nabla f=(2x-2,\,2y)=0$ gives $(1,0)$. $f_{xx}=2,\ f_{yy}=2,\ f_{xy}=0$, so $D=4>0$: a minimum.
# Practice
Q: Direction of fastest decrease of $f$? ::: $-\nabla f$.
Q: Find $f_x$ for $f=x^2y+\sin y$. ::: $2xy$.
== Module 4: Ordinary Differential Equations
# Key ideas
- For $ay''+by'+cy=0$ solve the **characteristic equation** $ar^2+br+c=0$.
- Distinct real roots: $y=C_1e^{r_1x}+C_2e^{r_2x}$. Repeated root: $y=(C_1+C_2x)e^{rx}$. Complex roots $\alpha\pm i\beta$: $y=e^{\alpha x}(C_1\cos\beta x+C_2\sin\beta x)$.
- **Non-homogeneous:** $y=y_h+y_p$. **Undetermined coefficients:** for $e^{kx}$ try $Ae^{kx}$ (multiply by $x$ if $k$ is already a root); for a polynomial try a polynomial of the same degree.
- **Stability:** all roots with negative real part: solutions decay (stable). Any positive real part: grows (unstable). **Resonance:** forcing at the natural frequency makes the amplitude grow like $x\sin\omega x$.
# Worked example
$y''-3y'+2y=0$: $r^2-3r+2=0$, $r=1,2$, so $y=C_1e^{x}+C_2e^{2x}$. For $y''+y=e^{2x}$: try $y_p=Ae^{2x}$, $4A+A=1$, $A=\frac{1}{5}$.
# Practice
Q: Roots $-1\pm 2i$: what is the solution and is it stable? ::: $e^{-x}(C_1\cos2x+C_2\sin2x)$. Stable, since the real part is $-1$.

== Module 1: Electromagnetism
# Key ideas
- **Faraday:** $\oint\vec E\cdot d\vec l=-\dfrac{d\Phi_B}{dt}$. **Ampère–Maxwell:** $\oint\vec B\cdot d\vec l=\mu_0\left(I+\epsilon_0\dfrac{d\Phi_E}{dt}\right)$. The second term (displacement current) is Maxwell’s addition.
- **Free space:** $\nabla\cdot\vec E=0,\ \nabla\cdot\vec B=0,\ \nabla\times\vec E=-\dfrac{\partial\vec B}{\partial t},\ \nabla\times\vec B=\mu_0\epsilon_0\dfrac{\partial\vec E}{\partial t}$.
- **Wave equation:** taking the curl of the curl gives $\nabla^2\vec E=\mu_0\epsilon_0\dfrac{\partial^2\vec E}{\partial t^2}$, a wave of speed $c=\dfrac{1}{\sqrt{\mu_0\epsilon_0}}$.
- **Poynting vector:** $\vec S=\dfrac{1}{\mu_0}\vec E\times\vec B$ is the power per unit area carried by the wave.
- **Magnetic materials:** diamagnetic (weak repulsion, $\chi<0$), paramagnetic (weak attraction, thermal agitation), ferromagnetic (strong, domains aligned by the **exchange interaction**, lost above the Curie temperature).
- **Applications:** Wi-Fi (2.4 and 5 GHz) and Bluetooth (2.4 GHz) are electromagnetic waves. **EMI** disturbs circuits; **shielding** with conductive enclosures (Faraday cage) blocks it. Skin depth $\delta=\sqrt{2/\omega\mu\sigma}$.
# Practice
Q: What did Maxwell add to Ampère’s law and why? ::: The displacement current $\epsilon_0\,d\Phi_E/dt$, so that a changing electric field also produces a magnetic field and waves are possible.
Q: Find $c$ from $\mu_0=4\pi\times10^{-7}$ and $\epsilon_0=8.85\times10^{-12}$. ::: $c\approx3\times10^{8}$ m/s.
== Module 2: Semiconductor Physics and Devices
# Key ideas
- **Intrinsic:** $n=p=n_i=\sqrt{N_cN_v}\,e^{-E_g/2kT}$, Fermi level near the middle of the gap. **n-type:** donors push $E_F$ toward $E_c$. **p-type:** acceptors push $E_F$ toward $E_v$. Mass-action law: $np=n_i^2$.
- **Electron density:** $n=N_c\,e^{-(E_c-E_F)/kT}$.
- **p–n junction:** diffusion leaves a depletion region with built-in potential $V_0=\dfrac{kT}{q}\ln\dfrac{N_AN_D}{n_i^2}$.
- **Diode equation:** $I=I_s\left(e^{V/\eta V_T}-1\right)$, $V_T=kT/q\approx26$ mV at 300 K. Forward: current rises sharply past about 0.7 V (silicon). Reverse: tiny saturation current $I_s$ until breakdown.
- **MOSFET:** gate voltage above $V_{th}$ forms an inversion channel between source and drain. Below $V_{th}$: off (open switch). Above: on (closed switch). In saturation $I_D=\frac{1}{2}\mu C_{ox}\dfrac{W}{L}(V_{GS}-V_{th})^2$.
# Practice
Q: How does doping change the Fermi level? ::: n-type moves it up toward the conduction band; p-type moves it down toward the valence band.
Q: Forward diode at $V=0.6$ V, $\eta=1$, $I_s=10^{-12}$ A. Find $I$. ::: $I\approx10^{-12}e^{0.6/0.026}\approx10^{-12}\times1.05\times10^{10}\approx10$ mA.
== Module 3: Quantum Physics
# Key ideas
- **Classical failures at small scale:** blackbody radiation, the photoelectric effect and atomic line spectra require energy quantization: $E=h\nu$. Matter behaves as waves: $\lambda=h/p$.
- **Uncertainty:** $\Delta x\,\Delta p\ge\hbar/2$. It limits how small a confined particle can be at rest and explains zero-point energy.
- **Schrödinger (1D, time-independent):** $-\dfrac{\hbar^2}{2m}\dfrac{d^2\psi}{dx^2}+V\psi=E\psi$.
- **Particle in a 1D box of width $L$:** $\psi_n=\sqrt{\dfrac2L}\sin\dfrac{n\pi x}{L}$, $E_n=\dfrac{n^2h^2}{8mL^2}$. Energy is quantized and the lowest energy is not zero.
- **Tunneling:** a particle can cross a barrier taller than its energy. $T\approx e^{-2\kappa a}$ with $\kappa=\dfrac{\sqrt{2m(V_0-E)}}{\hbar}$. Used in flash memory and tunnel diodes.
- **Quantum confinement:** smaller nanostructures have wider energy gaps, so a smaller quantum dot emits bluer light.
# Practice
Q: Ground-state energy of an electron in a 1 nm box. ::: $E_1=\dfrac{h^2}{8mL^2}\approx6.0\times10^{-20}$ J $\approx0.38$ eV.
Q: Why does a thicker barrier reduce tunneling? ::: $T$ falls exponentially with the barrier width $a$.
== Module 4: Laser and Fibre Optics
# Key ideas
- **Light–matter interaction:** absorption, spontaneous emission, **stimulated emission** (identical photon, same phase and direction). Lasing needs **population inversion** (pumping), an optical resonator (mirrors) and gain larger than loss (threshold).
- **Nd:YAG:** solid-state, four-level system, 1064 nm, pumped by flash lamp or diode. **He–Ne:** gas laser, 632.8 nm, electric discharge excites He which transfers energy to Ne by collisions.
- **Uses:** optical storage (CD 780 nm, DVD 650 nm, Blu-ray 405 nm), laser printing, barcode scanners.
- **Fibre:** guides light by total internal reflection. Critical angle $\sin\theta_c=\dfrac{n_2}{n_1}$ (core $n_1>$ cladding $n_2$). **Numerical aperture** $NA=\sqrt{n_1^2-n_2^2}=\sin\theta_0$.
- **Step-index:** abrupt core–cladding change, more modal dispersion. **Graded-index:** refractive index falls from the centre, less dispersion, higher bandwidth.
- **System:** transmitter (LED or laser), fibre, repeaters, receiver (photodiode). **Attenuation** $\alpha=\dfrac{10}{L}\log_{10}\dfrac{P_{in}}{P_{out}}$ dB/km. Used in high-speed internet, cloud and data centres.
# Practice
Q: Find $NA$ for $n_1=1.48,\ n_2=1.46$. ::: $\sqrt{1.48^2-1.46^2}=\sqrt{0.0588}\approx0.24$.
Q: Why is population inversion needed? ::: Normally more atoms are in the lower level and absorb; stimulated emission only wins if the upper level is more populated.

== Module 1: Algorithmic Foundations
# Key ideas
- **Problem solving steps:** understand the problem, plan, write the algorithm, code it, test, improve.
- **Algorithm properties:** finite, definite (clear steps), has input and output, effective.
- **Strategies:** brute force, divide and conquer, greedy, recursion, trial and error.
- **Flowchart symbols:** oval = start/end, parallelogram = input/output, rectangle = process, diamond = decision, arrows = flow.
- **Decomposition:** break a big problem into small sub-problems you can solve and test separately. Real-life use: planning a route, making a recipe, an ATM withdrawal.
# Worked example
Largest of three numbers: read $a,b,c$. If $a\ge b$ and $a\ge c$ print $a$; else if $b\ge c$ print $b$; else print $c$.
# Practice
Q: Write an algorithm to find the sum of the first $n$ natural numbers. ::: Set sum $=0$. For $i$ from 1 to $n$: sum $=$ sum $+\,i$. Print sum. (Or use $n(n+1)/2$.)
Q: Which symbol shows a yes/no question? ::: The diamond (decision).
== Module 2: Program Basics and Arrays
# Key ideas
- **Structure of a C program:** header `#include <stdio.h>`, then `int main(){ ... return 0; }` with declarations and statements. Every statement ends with `;`.
- **Types:** `int` (4 bytes), `float`, `double`, `char`. Input and output: `scanf("%d",&x);` and `printf("%d",x);`.
- **Operators:** arithmetic `+ - * / %`, relational `< > <= >= == !=`, logical `&& || !`, assignment `= += -=`, increment `++ --`, ternary `?:`. Integer division truncates: `7/2` is 3.
- **Control flow:** `if / else if / else`, `switch` with `break`, loops `for`, `while`, `do-while`, plus `break` and `continue`.
- **Arrays:** `int a[5];` has indices 0 to 4. Initialise with `{1,2,3}`. A 2D array is `int m[2][3];`.
- **Common mistakes:** `=` instead of `==`, missing `&` in `scanf`, off-by-one in loops.
# Worked example
```
#include <stdio.h>
int main(){
  int a[5]={2,4,6,8,10}, sum=0;
  for(int i=0;i<5;i++) sum+=a[i];
  printf("%d",sum);   // 30
  return 0;
}
```
# Practice
Q: What does `printf("%d",7/2);` print? ::: 3, because both operands are integers.
Q: How many elements does `int a[10]` have and what is the last index? ::: 10 elements, last index 9.
== Module 3: Strings and Functions
# Key ideas
- A **string** is a `char` array ending with `'\0'`. `char s[6]="hello";`. Use `fgets` to read a line (avoid `gets`).
- **String functions** (`<string.h>`): `strlen`, `strcpy`, `strcat`, `strcmp` (0 when equal).
- **Functions:** declaration (prototype), definition, call. Arguments are **passed by value**, so the function gets a copy. `return` sends a value back. **Recursion:** a function calls itself with a base case.
- **Structure:** groups different types: `struct student{ int id; char name[20]; float cgpa; };`. Access members with `.`
- **Storage classes:** `auto` (local, default), `register` (hint: keep in a register), `static` (keeps value between calls, local scope), `extern` (defined elsewhere, global lifetime).
# Worked example
```
int fact(int n){ if(n<=1) return 1; return n*fact(n-1); }
```
`fact(4)` returns $4\times3\times2\times1=24$.
# Practice
Q: Difference between `static` and `auto` variables? ::: `auto` is created on each call and lost on return; `static` keeps its value between calls.
Q: What does `strcmp("a","b")` return? ::: A negative number, since `"a"` comes before `"b"`.
== Module 4: Pointers and Files
# Key ideas
- A **pointer** stores an address: `int x=5; int *p=&x;` `*p` is the value at that address. Pointer arithmetic moves by the size of the type: `p+1` points to the next `int`. An array name is the address of its first element.
- **Pass by reference:** pass `&x` so the function can change the original.
- **Dynamic memory** (`<stdlib.h>`): `malloc(n*sizeof(int))`, `calloc` (zero filled), `realloc` (resize), `free` (release). Always check for `NULL` and free memory to avoid leaks.
- **Files:** `FILE *fp=fopen("a.txt","r");` Modes: `r`, `w`, `a`, `r+`, `w+`, `a+`. Always `fclose(fp)`.
- **Functions:** `fprintf`, `fscanf`, `fgetc`, `fputc`, `fgets`, `fputs`, `fread`, `fwrite`, `fseek`, `ftell`, `rewind`, `feof`.
# Worked example
```
int n=3, *a=(int*)malloc(n*sizeof(int));
for(int i=0;i<n;i++) a[i]=i*i;
free(a);
```
# Practice
Q: What is wrong with `int *p; *p=5;`? ::: `p` is uninitialised, so it points to an unknown address. Point it at valid memory first.
Q: Which mode opens a file for appending? ::: `"a"`.

== Module 1: Boolean Algebra and Logic Gates
# Key ideas
- **Number systems:** binary, octal and hexadecimal conversions; **two’s complement** represents negative numbers (invert the bits and add 1).
- **Boolean laws:** identity $A+0=A,\ A\cdot1=A$; null $A+1=1,\ A\cdot0=0$; idempotent $A+A=A$; complement $A+\overline{A}=1,\ A\overline{A}=0$; commutative, associative, distributive; absorption $A+AB=A$.
- **De Morgan:** $\overline{A+B}=\overline{A}\,\overline{B}$ and $\overline{AB}=\overline{A}+\overline{B}$. **Duality:** swap AND with OR and 0 with 1.
- **Gates:** AND, OR, NOT, NAND, NOR, XOR ($A\oplus B$, 1 when inputs differ), XNOR. **NAND and NOR are universal**: any circuit can be built from either alone.
# Worked example
$AB+A\overline{B}=A(B+\overline{B})=A\cdot1=A$.
# Practice
Q: Simplify $A+\overline{A}B$. ::: $A+B$.
Q: Build a NOT gate from NAND. ::: Tie both NAND inputs together: $\overline{A\cdot A}=\overline{A}$.
== Module 2: Combinational Logic Circuits
# Key ideas
- **Minterms and maxterms:** SOP (sum of products) and POS. **K-map:** group adjacent 1s in sizes 1, 2, 4, 8, as large as possible, to simplify.
- **Encoder:** $2^n$ inputs to $n$ outputs (priority encoder resolves multiple inputs). **Decoder:** $n$ inputs to $2^n$ outputs. **Multiplexer:** $2^n$ data inputs, $n$ select lines, one output; $Y=\sum m_iI_i$. **Demultiplexer:** one input routed to one of many outputs. **Comparator:** outputs $A>B$, $A=B$, $A<B$.
- **Half adder:** $S=A\oplus B,\ C=AB$. **Full adder:** $S=A\oplus B\oplus C_{in}$, $C_{out}=AB+C_{in}(A\oplus B)$.
- **Ripple carry adder:** $n$ full adders in a chain; the carry ripples, so delay grows with $n$.
# Worked example
Add $1+1$ with a half adder: $S=1\oplus1=0$, $C=1\cdot1=1$, so the result is $10_2$.
# Practice
Q: Select lines needed for an 8:1 mux? ::: 3.
Q: Why is a ripple carry adder slow? ::: Each stage waits for the carry from the previous stage.
== Module 3: Sequential Logic Fundamentals
# Key ideas
- **Sequential** circuits have memory: the output depends on inputs and the stored state (feedback). Combinational circuits depend only on current inputs.
- **SR latch** (NOR): $S=1$ sets $Q=1$, $R=1$ resets, $S=R=0$ holds, $S=R=1$ is invalid. **D latch:** transparent while enable is high, so $Q$ follows $D$.
- **Flip-flops** change only on a clock edge. **D:** $Q^+=D$. **T:** $Q^+=T\oplus Q$. **JK:** $Q^+=J\overline{Q}+\overline{K}Q$; $J=K=1$ toggles. **SR:** as the latch, but clocked.
- **Race-around** in a level-triggered JK is cured by edge triggering or master–slave design.
- **Registers** store several bits. **Shift registers:** SISO, SIPO, PISO, PIPO; shifting left or right can multiply or divide by 2.
# Practice
Q: JK flip-flop with $J=K=1$, $Q=0$. Next state? ::: Toggle, so $Q^+=1$.
Q: Difference between latch and flip-flop? ::: A latch is level-sensitive; a flip-flop is edge-triggered.
== Module 4: Counters, Memory, and Programmable Logic Devices
# Key ideas
- **Ripple (asynchronous) counter:** each flip-flop clocks the next, so delays add up. A mod-$2^n$ counter needs $n$ flip-flops. **Synchronous counter:** all flip-flops share one clock, so it is faster and glitch-free.
- **Mod-$N$ counter:** reset when the count reaches $N$. **Timing diagrams** show clock, inputs and outputs over time; each output toggles at half the frequency of the one before.
- **Memory:** ROM (non-volatile), RAM (SRAM fast, DRAM dense and needs refresh). Capacity $=2^{n}\times m$ bits with $n$ address lines and $m$ data lines.
- **PLDs:** PAL, PLA, CPLD are programmable AND/OR arrays. **FPGA:** an array of configurable logic blocks (look-up tables plus flip-flops), programmable routing and I/O blocks; reconfigurable after manufacture.
# Practice
Q: Address lines for a $1\text{K}\times8$ memory? ::: $2^{10}=1024$, so 10 address lines and 8 data lines.
Q: Number of flip-flops for a mod-16 counter? ::: 4, since $2^4=16$.

== Module 1: Linear DC Network Topologies and Matrix Analysis
# Key ideas
- **Active** elements supply energy (sources); **passive** ones absorb or store it (R, L, C). **Linear** elements obey superposition and proportionality; non-linear (diodes) do not.
- **Real source:** $V=E-Ir$ (internal resistance $r$ drops the terminal voltage). **Dependent sources** are controlled by another voltage or current.
- **KCL:** $\sum I=0$ at a node. **KVL:** $\sum V=0$ around a loop.
- **Mesh analysis:** write KVL for each loop current, giving $[R][I]=[V]$. A **supermesh** merges two meshes that share a current source.
- **Nodal analysis:** write KCL at each node, giving $[G][V]=[I]$. A **supernode** merges two nodes joined by a voltage source.
# Worked example
Single loop: 10 V source, $2\,\Omega$ and $3\,\Omega$ in series. $I=10/5=2$ A. Voltage across the $3\,\Omega$ resistor $=6$ V.
# Practice
Q: When do you use a supernode? ::: When an ideal voltage source connects two non-reference nodes.
Q: Why does a battery’s terminal voltage drop under load? ::: Current flowing through its internal resistance drops $Ir$.
== Module 2: Sinusoidal AC Steady State and Three-Phase Power
# Key ideas
- $v=V_m\sin\omega t$, $\omega=2\pi f$. **Average** over a half cycle $=\dfrac{2V_m}{\pi}$. **RMS** $=\dfrac{V_m}{\sqrt2}$. Form factor $=1.11$.
- **Phasors:** rectangular $Z=R+jX$, polar $Z=|Z|\angle\varphi$.
- **RL:** $Z=R+j\omega L$, current lags voltage. **RC:** $Z=R-\dfrac{j}{\omega C}$, current leads. **RLC series:** $Z=R+j\left(\omega L-\dfrac1{\omega C}\right)$.
- **Resonance:** $\omega_0=\dfrac1{\sqrt{LC}}$, $f_0=\dfrac1{2\pi\sqrt{LC}}$. $Z=R$ (minimum), current maximum, $Q=\dfrac{\omega_0L}{R}$, bandwidth $=\dfrac{f_0}{Q}$.
- **Power:** $P=VI\cos\varphi$ (W), $Q=VI\sin\varphi$ (VAR), $S=VI$ (VA), $S^2=P^2+Q^2$, power factor $=\cos\varphi$.
- **Three-phase:** star $V_L=\sqrt3V_{ph},\ I_L=I_{ph}$; delta $V_L=V_{ph},\ I_L=\sqrt3I_{ph}$; total power $\sqrt3\,V_LI_L\cos\varphi$.
# Worked example
$L=10$ mH, $C=10\ \mu$F: $f_0=\dfrac{1}{2\pi\sqrt{10^{-2}\times10^{-5}}}\approx503$ Hz.
# Practice
Q: RMS of a 325 V peak mains sine? ::: $325/\sqrt2\approx230$ V.
Q: At resonance in series RLC what is the phase angle? ::: $0^\circ$ (purely resistive).
== Module 3: Solid-State Diodes and Regulation
# Key ideas
- **Special diodes:** Zener (works in reverse breakdown, voltage reference), avalanche (breakdown by impact ionisation), tunnel (heavy doping, negative resistance), Schottky (metal–semiconductor, fast, low forward drop about 0.3 V), varactor (reverse-biased, voltage-controlled capacitance).
- **Half-wave rectifier:** $V_{dc}=\dfrac{V_m}{\pi}$, $V_{rms}=\dfrac{V_m}{2}$, ripple factor 1.21, efficiency 40.6%, PIV $=V_m$.
- **Full-wave rectifier:** $V_{dc}=\dfrac{2V_m}{\pi}$, $V_{rms}=\dfrac{V_m}{\sqrt2}$, ripple factor 0.48, efficiency 81.2%. PIV is $2V_m$ for centre-tap and $V_m$ for bridge.
- **Zener regulator:** $R_s=\dfrac{V_{in}-V_Z}{I_Z+I_L}$.
- **Junction capacitance** and **reverse recovery time $t_{rr}$** limit switching speed. **Current-limiting resistor** for a diode: $R=\dfrac{V_s-V_f}{I_F}$.
# Practice
Q: $V_{in}=12$ V, $V_Z=5.1$ V, $I_Z+I_L=20$ mA. Find $R_s$. ::: $R_s=(12-5.1)/0.02=345\,\Omega$.
Q: Why is a bridge rectifier preferred? ::: Full-wave output without a centre-tapped transformer, and PIV only $V_m$.
== Module 4: BJT Biasing and Performance
# Key ideas
- **BJT:** NPN or PNP with emitter, base, collector. **Regions:** cutoff (off), active (amplifier), saturation (on switch). $I_E=I_B+I_C$, $\alpha=\dfrac{I_C}{I_E}$, $\beta=\dfrac{I_C}{I_B}$, $\beta=\dfrac{\alpha}{1-\alpha}$.
- **Configurations:** CE (high voltage and current gain, 180° phase shift), CB (low input impedance, good high-frequency use), CC or emitter follower (voltage gain about 1, high input impedance, low output impedance).
- **Switch:** cutoff = open, saturation = closed. **Amplifier:** biased in the active region.
- **DC load line:** $V_{CE}=V_{CC}-I_CR_C$. The **Q-point** is where the load line meets the device curve.
- **Voltage-divider bias:** $V_B\approx V_{CC}\dfrac{R_2}{R_1+R_2}$, $I_E=\dfrac{V_B-V_{BE}}{R_E}$. It keeps the Q-point stable against changes in $\beta$.
- **Models:** low-frequency h-parameter, high-frequency hybrid-$\pi$ (adds capacitances), large-signal models.
# Practice
Q: $\beta=100$. Find $\alpha$. ::: $\alpha=\beta/(1+\beta)=0.99$.
Q: Why is voltage-divider bias preferred? ::: The Q-point barely depends on $\beta$, so the amplifier is stable.
